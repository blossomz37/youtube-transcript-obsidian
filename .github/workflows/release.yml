name: Build and release
on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check install assets
        run: |
          test -s main.js
          cmp main.js dist/youtube-transcript-notes/main.js
          cmp manifest.json dist/youtube-transcript-notes/manifest.json
          cmp styles.css dist/youtube-transcript-notes/styles.css
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          for (const file of ['manifest.json', 'package.json', 'package-lock.json']) {
            assert.equal(JSON.parse(readFileSync(file)).version, process.env.GITHUB_REF_NAME, file);
          }
          JS
      - name: Attest release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
            --verify-tag --title "YouTube Transcript Notes $GITHUB_REF_NAME" --generate-notes
